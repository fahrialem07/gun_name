[package]
name = "gunname"
version = "0.1.0"
description = "GÜNNAME kişisel planlayıcı"
authors = ["Günname Contributors"]
edition = "2021"
rust-version = "1.90"

[lib]
name = "gunname_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.7.4", features = [] }

[dependencies]
tauri = { version = "=2.12.5", features = [] }
tauri-plugin-dialog = "=2.8.4"
