name: Windows kurulum dosyası

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-installer:
    name: GÜNNAME Windows x64 (NSIS)
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      CARGO_TERM_COLOR: always
    steps:
      - name: Kaynak kodunu al
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Node.js 24
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          cache: npm
      - name: Rust stable (MSVC)
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          toolchain: stable
          targets: x86_64-pc-windows-msvc
          components: rustfmt
      - name: Kilitli npm bağımlılıkları
        run: npm ci
      - name: Birim testleri
        run: npm test
      - name: Web derlemesi
        run: npm run build
      - name: Test tarayıcısını kur
        run: npx playwright install chromium
      - name: Masaüstü ve mobil web testleri
        run: npm run test:e2e
      - name: Rust biçim kontrolü
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --check
      - name: Windows NSIS kurulum dosyasını derle
        run: npm run desktop:build -- --ci --target x86_64-pc-windows-msvc -- --locked
      - name: Kurulum dosyasını ve SHA256 özetini hazırla
        shell: pwsh
        run: |
          $installers = @(Get-ChildItem 'src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe')
          if ($installers.Count -eq 0) { throw 'NSIS kurulum dosyası oluşmadı.' }
          New-Item -ItemType Directory -Path artifacts -Force | Out-Null
          $checksums = foreach ($installer in $installers) {
            Copy-Item $installer.FullName artifacts/
            $digest = (Get-FileHash $installer.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$digest  $($installer.Name)"
          }
          $checksums | Set-Content artifacts/SHA256SUMS.txt -Encoding utf8
      - name: Kurulum dosyasını artifact olarak yükle
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: Gunname-Windows-x64-NSIS
          path: artifacts/*
          if-no-files-found: error
          retention-days: 14
